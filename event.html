<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学生イベント｜EIMEIグループ</title>
<meta name="description" content="EIMEIグループの小学生向けイベントのご案内です。">
<meta property="og:type" content="website">
<meta property="og:title" content="小学生イベント｜EIMEIグループ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
/* テーマごとの色。config.theme で切りかえる */
:root{--bg:#eef7ff;--bg2:#ffffff;--ink:#1c2a4a;--sub:#4e5a74;--accent:#ff7a1a;--accent-d:#d95e00;--accent2:#1f6fd1;--card:#ffffff;--line:#06C755;--rule:#dbe6f3;--hero-ink:#1c2a4a;--hero-bg:linear-gradient(180deg,#bfe3ff 0%,#eaf6ff 70%,#ffffff 100%);--pattern:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 0 40px,transparent 41px),radial-gradient(circle at 70% 18%,rgba(255,255,255,.8) 0 28px,transparent 29px)}
body[data-theme="space"]{--bg:#0d1433;--bg2:#141d46;--ink:#eef2ff;--sub:#b9c3e8;--accent:#ffd23f;--accent-d:#d9a900;--accent2:#7ec8ff;--card:#18224f;--rule:#2a3670;--hero-ink:#ffffff;--hero-bg:radial-gradient(ellipse at 70% 0%,#2d3f9c 0%,#0d1433 60%);--pattern:radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1.6px),radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1.6px)}
body[data-theme="halloween"]{--bg:#1d1230;--bg2:#271843;--ink:#fff3e6;--sub:#d9c6e8;--accent:#ff8a1f;--accent-d:#d96800;--accent2:#b58cff;--card:#2c1c4b;--rule:#43306a;--hero-ink:#fff3e6;--hero-bg:radial-gradient(ellipse at 80% 10%,#5b2e8c 0%,#1d1230 65%);--pattern:radial-gradient(circle,rgba(255,170,60,.55) 1px,transparent 1.8px)}
body[data-theme="christmas"]{--bg:#f7faf6;--bg2:#ffffff;--ink:#1f3324;--sub:#4d6151;--accent:#d7263d;--accent-d:#a8162b;--accent2:#1f7a4d;--card:#ffffff;--rule:#dfe9e0;--hero-ink:#ffffff;--hero-bg:linear-gradient(180deg,#14532d 0%,#1f7a4d 100%);--pattern:radial-gradient(circle,rgba(255,255,255,.85) 1.5px,transparent 2.2px)}
body[data-theme="lab"]{--bg:#f4fbfa;--bg2:#ffffff;--ink:#14303a;--sub:#4b6670;--accent:#00a39b;--accent-d:#007f78;--accent2:#ff5f7e;--card:#ffffff;--rule:#d6ebe8;--hero-ink:#14303a;--hero-bg:linear-gradient(180deg,#d9f4f1 0%,#ffffff 100%);--pattern:linear-gradient(rgba(0,163,155,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(0,163,155,.12) 1px,transparent 1px)}
body[data-theme="summer"]{--bg:#fff8ef;--bg2:#ffffff;--ink:#2a1d3d;--sub:#5d5070;--accent:#e8384f;--accent-d:#b9233a;--accent2:#2b4fa8;--card:#ffffff;--rule:#f1e3d3;--hero-ink:#ffffff;--hero-bg:linear-gradient(180deg,#25337a 0%,#5a3d8f 100%);--pattern:radial-gradient(circle at 50% 120%,rgba(255,214,102,.45) 0 30px,transparent 31px)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:"M PLUS Rounded 1c","Zen Kaku Gothic New",sans-serif;line-height:1.35;text-wrap:balance}
a{color:var(--accent2)}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hidden{display:none !important}
section{padding:72px 0;scroll-margin-top:64px}
.sec-h{margin-bottom:28px}
.sec-h .kicker{display:inline-block;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;color:var(--accent);font-size:15px}
.sec-h h2{font-size:clamp(24px,4.4vw,34px);font-weight:800;margin-top:2px}
.sec-h p{color:var(--sub);margin-top:10px;max-width:44em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 24px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer;font-family:"M PLUS Rounded 1c",inherit;line-height:1.3}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
.btn-line{background:var(--line);color:#fff;box-shadow:0 4px 0 #04a045}
.btn-line:hover{color:#fff;filter:brightness(1.05)}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-d)}
.btn-accent:hover{color:#fff}
.btn-ghost{background:transparent;color:var(--hero-ink);border:2px solid currentColor}
.btn svg{width:20px;height:20px}

/* 上のバー */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg2) 94%,transparent);border-bottom:1px solid var(--rule);backdrop-filter:blur(6px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px}
.bar .campus{font-weight:800;font-size:13.5px;line-height:1.35;color:var(--ink);text-decoration:none;min-width:0}
.bar .btn{min-height:40px;padding:8px 16px;font-size:14px;box-shadow:none;flex:0 0 auto}

/* ファーストビュー */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-ink);padding:44px 0 64px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:var(--pattern);background-size:180px 180px,260px 260px;background-position:0 0,97px 131px;opacity:.9;pointer-events:none}
.hero.noflyer .wrap{grid-template-columns:minmax(0,760px)}
body[data-theme="lab"] .hero::before{background-size:28px 28px}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:36px;align-items:center}
.hero .catch{display:inline-block;font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px;background:var(--accent);color:#fff;border-radius:999px;padding:4px 16px;transform:rotate(-2deg)}
.hero h1{font-size:clamp(34px,6.4vw,62px);font-weight:800;margin:14px 0 14px;letter-spacing:.01em}
.hero .lead{font-size:16.5px;max-width:30em;opacity:.95}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0 22px;max-width:520px}
.fact{background:color-mix(in srgb,var(--bg2) 88%,transparent);color:var(--ink);border-radius:14px;padding:10px 14px;min-width:0;border:1px solid var(--rule)}
.fact small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.fact b{font-size:16.5px;font-family:"M PLUS Rounded 1c",sans-serif}
.fact.big b{font-size:22px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.count{margin-top:16px;font-weight:800;font-family:"M PLUS Rounded 1c",sans-serif;font-size:15px}
.count b{font-size:26px;color:var(--accent);margin:0 4px}
.deadline{display:inline-block;margin-left:10px;background:#fff;color:#c8102e;border-radius:8px;padding:2px 10px;font-size:14px}
.flyer{position:relative;justify-self:center;max-width:380px;width:100%}
.flyer img{border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.25);transform:rotate(2deg);border:6px solid #fff}
.flyer .tap{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);background:var(--bg2);color:var(--ink);font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 12px;border:1px solid var(--rule);white-space:nowrap}

/* 目次 */
.toc{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;max-width:1040px;margin:0 auto;scrollbar-width:none}
.toc a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}

/* 見どころ */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--rule);min-width:0;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover}
.card .body{padding:18px 18px 20px}
.card .label{display:inline-block;font-size:12.5px;font-weight:800;color:#fff;background:var(--accent2);border-radius:6px;padding:2px 10px}
.card h3{font-size:19px;margin:8px 0 6px;font-weight:800}
.card p{font-size:14.5px;color:var(--sub)}
.story{margin-top:22px;border-radius:20px;padding:24px;background:var(--card);border:2px dashed var(--accent)}
.story .label{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;color:var(--accent)}
.story h3{font-size:22px;margin:4px 0 8px;font-weight:800}
.story p{color:var(--sub)}

/* 1日の流れ */
.timeline{list-style:none;margin:0;padding:0;position:relative;max-width:720px}
.timeline::before{content:"";position:absolute;left:62px;top:10px;bottom:10px;border-left:3px dotted var(--rule)}
.timeline li{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:28px;padding:10px 0}
.timeline time{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:17px;text-align:right;color:var(--accent)}
.timeline li::after{content:"";position:absolute;left:56px;top:19px;width:15px;height:15px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.timeline b{display:block;font-size:17px}
.timeline span{display:block;font-size:14.5px;color:var(--sub)}
.note{font-size:13px;color:var(--sub);margin-top:14px}

/* 持ち物・保護者の方へ */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.box{background:var(--card);border-radius:18px;padding:22px;border:1px solid var(--rule);min-width:0}
.box h3{font-size:19px;font-weight:800;margin-bottom:10px}
.check{list-style:none;margin:0;padding:0}
.check li{border-top:1px dashed var(--rule)}
.check li:first-child{border-top:0}
.check label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:0 0 auto}
.check b{display:block}
.check small{display:block;color:var(--sub);font-size:13.5px}
.meter{margin-top:12px;font-weight:800;font-size:14px;color:var(--sub)}
.bullets{margin:0;padding-left:1.2em}
.bullets li{margin:6px 0;font-size:15px}

/* これまで */
.past{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.past .card .date{font-size:13px;color:var(--sub);font-weight:700}
.nums{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.num{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 18px;min-width:10em}
.num b{display:block;font-family:"M PLUS Rounded 1c",sans-serif;font-size:30px;color:var(--accent);line-height:1.2}
.num span{font-size:13.5px;font-weight:700}

/* 申込 */
#apply{background:var(--bg2)}
.apply{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{position:relative;padding:12px 0 12px 46px;border-top:1px dashed var(--rule)}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:12px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.steps b{display:block}
.steps span{font-size:14.5px;color:var(--sub)}
.prefill{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px}
.prefill h3{font-size:18px;font-weight:800}
.prefill p{font-size:14px;color:var(--sub);margin:4px 0 10px}
.prefill pre{white-space:pre-wrap;font-family:inherit;background:var(--bg);color:var(--ink);border-radius:10px;padding:12px;font-size:14px;margin:0 0 14px;border:1px dashed var(--rule)}
.prefill .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prefill .sub{font-size:13.5px}
.friends{margin-top:16px;font-size:14px;background:color-mix(in srgb,var(--accent) 12%,var(--card));border-radius:12px;padding:12px 14px}
.dl{display:inline-block;margin-top:14px;font-weight:800;color:#c8102e}

/* Q&A・会場 */
.faq details{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:0 18px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:800;padding:16px 0;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"Q. ";color:var(--accent)}
.faq details p{padding:0 0 16px;font-size:15px;color:var(--sub)}
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:26px}
.info dl{margin:0}
.info dt{font-size:12.5px;font-weight:800;color:var(--accent);margin-top:10px}
.info dt:first-of-type{margin-top:0}
.info dd{margin:0;font-size:15px}
.final{background:var(--hero-bg);color:var(--hero-ink);text-align:center;padding:64px 0}
.final h2{font-size:clamp(24px,4.4vw,34px);font-weight:800}
.final p{margin:10px auto 22px;max-width:34em;opacity:.95}
footer{padding:22px 0 100px;font-size:12px;color:var(--sub);text-align:center}
.dock{position:fixed;right:18px;bottom:18px;z-index:40}
.dock .btn{box-shadow:0 8px 20px rgba(0,0,0,.22)}
.empty{padding:120px 20px;text-align:center;color:var(--sub)}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:minmax(0,1fr)}
  .flyer{max-width:320px}
  .cards,.past{grid-template-columns:repeat(2,minmax(0,1fr))}
  .apply{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  section{padding:56px 0}
  .wrap{padding:0 16px}
  .cards,.past,.two,.info{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .dock{left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg2) 96%,transparent);border-top:1px solid var(--rule)}
  .dock .btn{width:100%;box-shadow:none}
  .timeline::before{left:52px}
  .timeline li{grid-template-columns:44px minmax(0,1fr);gap:24px}
  .timeline li::after{left:46px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body data-theme="sky">
<div id="app"><p class="empty">読み込み中です…</p></div>

<script>
(function(){
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function br(s){return esc(s).replace(/\n/g,"<br>")}
function ev(n,d){try{window.va&&window.va("event",{name:n,data:d||{}})}catch(e){}}
var LINE_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.8c0 .3-.2 1 .9.5s5.9-3.5 8-6c1.4-1.6 2-3.1 2-4.7C22 6.6 17.5 3 12 3z" fill="currentColor"/></svg>';

function lineMsg(c){
  var a=c.apply||{}; var lines=[a.prefix||("【申込】"+((c.event||{}).title||""))];
  (a.items||[]).forEach(function(it){lines.push(it+"：")});
  return lines.join("\n");
}
function lineHref(c){
  var id=((c.campus||{}).lineId||"").trim();
  if(!id) return (c.campus||{}).lineUrl||"#apply";
  if(id.charAt(0)!=="@") id="@"+id;
  return "https://line.me/R/oaMessage/"+encodeURIComponent(id)+"/?"+encodeURIComponent(lineMsg(c));
}
function daysTo(iso){ if(!iso) return null; var t=new Date(iso+"T00:00:00+09:00"), n=new Date(); var d=Math.ceil((t-n)/86400000); return d; }

function render(c){
  var E=c.event||{}, C=c.campus||{}, A=c.apply||{};
  document.body.setAttribute("data-theme",c.theme||"sky");
  var title=(E.title||"イベント")+"｜"+(C.name||"EIMEIグループ");
  document.title=title;
  var md=document.querySelector('meta[name="description"]'); if(md&&E.lead) md.setAttribute("content",E.lead.slice(0,120));
  var og=document.querySelector('meta[property="og:title"]'); if(og) og.setAttribute("content",title);
  var href=lineHref(c), addHref=C.lineUrl||href;
  var h=[];
  var toc=[];
  if((c.highlights||[]).length||c.story) toc.push(["spots","見どころ"]);
  if((c.schedule||[]).length) toc.push(["day","当日の流れ"]);
  if((c.belongings||[]).length||(c.notices||[]).length) toc.push(["bring","持ち物"]);
  if(c.past&&((c.past.items||[]).length||(c.past.numbers||[]).length)) toc.push(["past","これまで"]);
  toc.push(["apply","申込"]);
  if((c.faq||[]).length) toc.push(["faq","Q&A"]);

  h.push('<header class="bar"><div class="wrap"><a class="campus" href="#top">'+esc(C.name||"EIMEIグループ")+'</a><a class="btn btn-line" href="'+esc(href)+'" data-ev="line_top">'+LINE_SVG+'申し込む</a></div></header>');
  h.push('<main id="top"><section class="hero'+(E.flyer?'':' noflyer')+'"><div class="wrap"><div>');
  if(E.catch) h.push('<span class="catch">'+esc(E.catch)+'</span>');
  h.push('<h1>'+br(E.title||"")+'</h1>');
  if(E.lead) h.push('<p class="lead">'+br(E.lead)+'</p>');
  var facts=[["日にち",E.dateLabel,1],["時間",E.time],["集合・場所",E.place],["対象",E.target],["参加費",E.fee],["定員",E.capacity]].filter(function(f){return f[1]});
  if(facts.length) h.push('<div class="facts">'+facts.map(function(f){return '<div class="fact'+(f[2]?' big':'')+'"><small>'+f[0]+'</small><b>'+br(f[1])+'</b></div>'}).join("")+'</div>');
  h.push('<div class="hero-cta"><a class="btn btn-line" href="'+esc(href)+'" data-ev="line_hero">'+LINE_SVG+'LINEで申し込む</a>'+(toc.length>1?'<a class="btn btn-ghost" href="#'+toc[0][0]+'">くわしく見る</a>':'')+'</div>');
  var dd=daysTo(E.date);
  if(dd!=null&&dd>=0) h.push('<p class="count">当日まで あと<b>'+dd+'</b>日'+(E.deadlineLabel?'<span class="deadline">申込締切 '+esc(E.deadlineLabel)+'</span>':'')+'</p>');
  else if(E.deadlineLabel) h.push('<p class="count"><span class="deadline" style="margin-left:0">申込締切 '+esc(E.deadlineLabel)+'</span></p>');
  h.push('</div>');
  if(E.flyer) h.push('<a class="flyer" href="'+esc(E.flyer)+'" target="_blank" rel="noopener"><img src="'+esc(E.flyer)+'" alt="'+esc(E.title||"")+'のチラシ"><span class="tap">タップでチラシを大きく見る</span></a>');
  h.push('</div></section>');
  if(toc.length>1) h.push('<nav class="toc" aria-label="ページ内">'+toc.map(function(t){return '<a href="#'+t[0]+'">'+t[1]+'</a>'}).join("")+'</nav>');

  if((c.highlights||[]).length||c.story){
    h.push('<section id="spots"><div class="wrap"><div class="sec-h"><span class="kicker">'+esc(c.highlightsKicker||"見どころ")+'</span><h2>'+br(c.highlightsTitle||"当日のお楽しみ")+'</h2>'+(c.highlightsLead?'<p>'+br(c.highlightsLead)+'</p>':'')+'</div>');
    if((c.highlights||[]).length) h.push('<div class="cards">'+c.highlights.map(function(x){return '<article class="card">'+(x.image?'<img src="'+esc(x.image)+'" alt="" loading="lazy">':'')+'<div class="body">'+(x.label?'<span class="label">'+esc(x.label)+'</span>':'')+'<h3>'+br(x.title)+'</h3><p>'+br(x.text)+'</p></div></article>'}).join("")+'</div>');
    if(c.story) h.push('<div class="story"><span class="label">'+esc(c.story.label||"")+'</span><h3>'+br(c.story.title)+'</h3><p>'+br(c.story.text)+'</p></div>');
    if(c.highlightsNote) h.push('<p class="note">'+br(c.highlightsNote)+'</p>');
    h.push('</div></section>');
  }
  if((c.schedule||[]).length){
    h.push('<section id="day"><div class="wrap"><div class="sec-h"><span class="kicker">当日の流れ</span><h2>'+esc(E.dateLabel||"")+' のスケジュール</h2></div><ol class="timeline">'+c.schedule.map(function(s){return '<li><time>'+esc(s.time)+'</time><div><b>'+br(s.title)+'</b>'+(s.text?'<span>'+br(s.text)+'</span>':'')+'</div></li>'}).join("")+'</ol>'+(c.scheduleNote?'<p class="note">'+br(c.scheduleNote)+'</p>':'')+'</div></section>');
  }
  if((c.belongings||[]).length||(c.notices||[]).length){
    h.push('<section id="bring"><div class="wrap"><div class="sec-h"><span class="kicker">持ち物と保護者の方へ</span><h2>準備しておくもの</h2></div><div class="two">');
    if((c.belongings||[]).length) h.push('<div class="box"><h3>持ち物チェック</h3><ul class="check">'+c.belongings.map(function(b,i){return '<li><label><input type="checkbox" data-bring="'+i+'"><span><b>'+esc(b.name)+'</b>'+(b.note?'<small>'+esc(b.note)+'</small>':'')+'</span></label></li>'}).join("")+'</ul><p class="meter" id="meter">チェック 0 / '+c.belongings.length+'</p></div>');
    if((c.notices||[]).length) h.push('<div class="box"><h3>保護者の方へ</h3><ul class="bullets">'+c.notices.map(function(n){return '<li>'+br(n)+'</li>'}).join("")+'</ul></div>');
    h.push('</div></div></section>');
  }
  var P=c.past;
  if(P&&((P.items||[]).length||(P.numbers||[]).length)){
    h.push('<section id="past"><div class="wrap"><div class="sec-h"><span class="kicker">これまでのイベント</span><h2>'+br(P.title||"こんなイベントをしてきました")+'</h2>'+(P.lead?'<p>'+br(P.lead)+'</p>':'')+'</div>');
    if((P.numbers||[]).length) h.push('<div class="nums">'+P.numbers.map(function(n){return '<div class="num"><b>'+esc(n.value)+'</b><span>'+esc(n.label)+'</span></div>'}).join("")+'</div>');
    if((P.items||[]).length) h.push('<div class="past">'+P.items.map(function(x){return '<article class="card">'+(x.image?'<img src="'+esc(x.image)+'" alt="" loading="lazy">':'')+'<div class="body"><span class="date">'+esc(x.date||"")+'</span><h3>'+br(x.title)+'</h3><p>'+br(x.text)+'</p></div></article>'}).join("")+'</div>');
    h.push('</div></section>');
  }
  // 申込
  var steps=(A.steps&&A.steps.length)?A.steps:[{title:"公式LINEを開く",text:"下のボタンから、校舎の公式LINEを開きます。"},{title:"申込の文を送る",text:"入力欄に申込の文が入っています。「：」のあとを書き足して送ってください。"},{title:"校舎からの返信で申込完了",text:"当日の連絡は、公式LINEでお知らせします。"}];
  h.push('<section id="apply"><div class="wrap"><div class="sec-h"><span class="kicker">申込</span><h2>公式LINEで、かんたん申込</h2>'+(E.deadlineLabel?'<p>申込締切は <b>'+esc(E.deadlineLabel)+'</b> です。</p>':'')+'</div><div class="apply"><ol class="steps">'+steps.map(function(s){return '<li><b>'+esc(s.title)+'</b><span>'+br(s.text)+'</span></li>'}).join("")+'</ol>');
  h.push('<div class="prefill"><h3>申込の文が入った状態でLINEが開きます</h3><p>「：」のあとを書き足して送るだけです。</p><pre>'+esc(lineMsg(c))+'</pre><div class="row"><a class="btn btn-line" href="'+esc(href)+'" data-ev="line_apply">'+LINE_SVG+'申込の文を入れてLINEを開く</a>'+(C.lineUrl?'<a class="sub" href="'+esc(C.lineUrl)+'" data-ev="line_add">友だち追加だけする</a>':'')+'</div>');
  if(A.friendsNote) h.push('<p class="friends">'+br(A.friendsNote)+'</p>');
  if(C.tel) h.push('<p class="note">お電話でのお問い合わせ：<a href="tel:'+esc(C.tel.replace(/[^0-9+]/g,""))+'">'+esc(C.tel)+'</a>'+(C.telNote?'（'+esc(C.telNote)+'）':'')+'</p>');
  h.push('</div></div></div></section>');
  if((c.faq||[]).length||c.place||C.address){
    h.push('<section id="faq" class="faq"><div class="wrap"><div class="sec-h"><span class="kicker">Q&amp;A</span><h2>よくある質問</h2></div>');
    (c.faq||[]).forEach(function(f){h.push('<details><summary>'+esc(f.q)+'</summary><p>'+br(f.a)+'</p></details>')});
    h.push('<div class="info">');
    if(c.place&&c.place.name) h.push('<div class="box"><h3>会場・行き先</h3><dl><dt>名前</dt><dd>'+esc(c.place.name)+'</dd>'+(c.place.address?'<dt>住所</dt><dd>'+esc(c.place.address)+'</dd>':'')+(c.place.access?'<dt>アクセス</dt><dd>'+br(c.place.access)+'</dd>':'')+(c.place.url?'<dt>くわしく</dt><dd><a href="'+esc(c.place.url)+'" target="_blank" rel="noopener">公式ページ</a></dd>':'')+'</dl></div>');
    h.push('<div class="box"><h3>主催</h3><dl><dt>校舎</dt><dd>'+esc(C.name||"")+'</dd>'+(C.address?'<dt>住所</dt><dd>'+esc(C.address)+'</dd>':'')+(C.access?'<dt>アクセス</dt><dd>'+br(C.access)+'</dd>':'')+(C.hp?'<dt>校舎のページ</dt><dd><a href="'+esc(C.hp)+'" target="_blank" rel="noopener">'+esc(C.hp.replace(/^https?:\/\//,""))+'</a></dd>':'')+'</dl></div>');
    h.push('</div></div></section>');
  }
  h.push('<section class="final"><div class="wrap"><h2>'+br(c.finalTitle||"いっしょに楽しもう！")+'</h2>'+(c.finalText?'<p>'+br(c.finalText)+'</p>':'<p>お友だちと一緒の参加も大歓迎です。</p>')+'<a class="btn btn-line" href="'+esc(href)+'" data-ev="line_final">'+LINE_SVG+'LINEで申し込む</a></div></section></main>');
  h.push('<footer>© EIMEI GROUP ／ '+esc(C.name||"")+'</footer>');
  h.push('<div class="dock"><a class="btn btn-line" href="'+esc(href)+'" data-ev="line_dock">'+LINE_SVG+'LINEで申し込む'+(E.deadlineLabel?'（締切 '+esc(E.deadlineLabel)+'）':'')+'</a></div>');
  document.getElementById("app").innerHTML=h.join("");

  var boxes=document.querySelectorAll("[data-bring]"), meter=document.getElementById("meter");
  Array.prototype.forEach.call(boxes,function(b){b.addEventListener("change",function(){var n=document.querySelectorAll("[data-bring]:checked").length;meter.textContent="チェック "+n+" / "+boxes.length+(n===boxes.length?"　準備OK！":"")})});
  Array.prototype.forEach.call(document.querySelectorAll("[data-ev]"),function(a){a.addEventListener("click",function(){ev(a.dataset.ev,{slug:c.slug||""})})});
}

function fail(msg){document.getElementById("app").innerHTML='<p class="empty">'+esc(msg)+'</p>'}
async function fromHash(){
  var m=location.hash.match(/data=([^&]+)/); if(!m) return null;
  var b64=m[1].replace(/-/g,"+").replace(/_/g,"/"); while(b64.length%4) b64+="=";
  var bin=atob(b64), bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  var ds=new DecompressionStream("deflate-raw"); var text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  return JSON.parse(text);
}
window.addEventListener("message",function(e){ if(e.data&&e.data.type==="eventlp:config"){ try{render(e.data.config)}catch(err){fail("表示できませんでした："+err.message)} } });
(async function(){
  try{
    var c=await fromHash(); if(c){render(c);return}
    var slug=(location.pathname.match(/\/e\/([a-z0-9-]+)/i)||[])[1]||new URLSearchParams(location.search).get("e");
    if(!slug){ if(window.parent!==window) return; fail("イベントが見つかりませんでした。"); return }
    var r=await fetch("/events/"+slug+".json",{cache:"no-cache"}); if(!r.ok) throw new Error("not found");
    c=await r.json(); c.slug=slug; render(c);
  }catch(e){fail("イベントが見つかりませんでした。")}
})();
})();
</script>
